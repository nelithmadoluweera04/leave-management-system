<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>

  <link rel="stylesheet" href="dashboard-style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<body>

        <i class="fa-solid fa-calendar-check logo-icon"></i>

      </div>
      <nav class="sidebar-menu">
        <a href="#"  class="active"><i class="fa-solid fa-house"></i> Dashboard</a>
        <a href="#"><i class="fa-solid fa-plane-departure"></i> Apply Leave</a>

        <a href="#" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
      </div>

    <main class="main-content">
    <header class="top-header">
        <h1>Dashboard</h1>
        <div class="user-badge">

  </div>
